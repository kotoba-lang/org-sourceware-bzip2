name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
      # bzip2 is preinstalled on ubuntu-latest; make the dependency explicit so a
      # runner change turns into a failure here rather than a silent skip.
      - name: Check for the reference tools
        run: bzip2 --version 2>&1 | head -1; command -v bunzip2
      - name: Run tests
        run: clojure -M:test
      - name: Lint
        run: clojure -M:lint

  cljs:
    name: nbb run-tests.cljk (ClojureScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb@1.4.210
      # zero dependencies: nothing to fetch, the fixtures are checked in
      - run: nbb run-tests.cljk
